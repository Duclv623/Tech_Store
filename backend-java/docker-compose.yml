services:
  postgres:
    image: postgres:15-alpine
    container_name: gocart-postgres
    environment:
      POSTGRES_DB: gocart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gocart-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gocart-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/gocart
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      SPRING_PROFILES_ACTIVE: prod
      # Bí mật: đặt trong shell hoặc file .env cạnh compose để override.
      # Nếu không set, JWT dùng default dev (KHÔNG dùng default này khi deploy thật).
      JWT_SECRET: ${JWT_SECRET:-ZGV2LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi1taW4tMzItYnl0ZXMh}
      # Email (tính năng xác thực / reset mật khẩu). Bỏ trống nếu chưa dùng.
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # MinIO: endpoint nội bộ qua mạng Docker; public-url để browser xem ảnh
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin123}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-admin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-gocart}
      # Redis: host là tên service trong mạng Docker (không phải localhost)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - gocart-network
    restart: unless-stopped

  frontend:
    build:
      context: ../tmp
      dockerfile: dockerfile
    container_name: gocart-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - gocart-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: gocart-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin123}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Console
    volumes:
      - minio_data:/data
    networks:
      - gocart-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gocart-redis
    ports:
      - "6379:6379"
    networks:
      - gocart-network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  gocart-network:
    driver: bridge