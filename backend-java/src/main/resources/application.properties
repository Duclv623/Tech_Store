# Server Configuration
server.port=8080
spring.application.name=gocart-backend

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gocart}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Thêm dòng này để hoãn việc chạy script khởi tạo cho đến khi Hibernate tạo bảng xong:
spring.jpa.defer-datasource-initialization=true

# Schema patch (runs before Hibernate on existing PostgreSQL DBs)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/patch-email-verified.sql,classpath:db/patch-stock-quantity.sql

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Actuator: chỉ lộ /actuator/health (dùng cho Docker healthcheck)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS Configuration
spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*

# JWT (override JWT_SECRET in prod; must be >= 32 bytes Base64 for HS256)
app.jwt.secret=${JWT_SECRET:ZGV2LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi1taW4tMzItYnl0ZXMh}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Email user sẽ được tự động set role=ADMIN khi app khởi động (bootstrap)
app.admin.email=${ADMIN_EMAIL:admin@gocart.local}
# ===== Email / SMTP (Gmail) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:levanduc06022003@gmail.com}

# URL frontend để tạo link reset password
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

#MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:admin123}
minio.secret-key=${MINIO_SECRET_KEY:admin123}
minio.bucket-name=${MINIO_BUCKET_NAME:gocart}
# URL công khai để trình duyệt xem ảnh (trong Docker endpoint là http://minio:9000 nhưng browser phải gọi localhost)
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}

# Giới hạn dung lượng upload ảnh
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}